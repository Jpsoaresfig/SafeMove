<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
</head>
<body>
    <h1>Cadastro de Produto</h1>
    <form action="/cadastrarProduto" method="post" th:object="${produto}">
        <div>
            <label for="tombamento">Tombamento (5 caracteres):</label>
            <input type="number" id="tombamento" name="tombamento" th:field="*{tombamento}" minlength="5" maxlength="5" required>
            <small>Informe o número de tombamento com 5 caracteres.</small>
        </div>

        <div>
            <label for="descricao">Descrição:</label>
            <textarea id="descricao" name="descricao" th:field="*{descricao}" required></textarea>
        </div>

        <div>
            <label for="modelo">Modelo:</label>
            <input type="text" id="modelo" name="modelo" th:field="*{modelo}">
            <small>Informe o nome ou identificador do modelo.</small>
        </div>

        <div>
            <label for="pessoa">Colaborador Responsável:</label>
            <input type="text" id="pessoa" name="pessoa" th:field="*{pessoa}">
            <small>Informe o nome do colaborador responsável.</small>
        </div>

        <button type="submit">Cadastrar Produto</button>
        <a href="/cadastrarProduto/listarProdutos">Cancelar</a>
    </form>
</body>
</html>
