<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        table {
            width: 80%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        thead {
            background-color: #007bff;
            color: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tbody tr:hover {
            background-color: #e9ecef;
        }

        td a {
            color: #007bff;
            text-decoration: none;
            margin: 0 5px;
        }

        td a:hover {
            text-decoration: underline;
        }

        td span {
            color: #6c757d;
        }

        a.button {
            display: inline-block;
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }

        a.button:hover {
            background-color: #1e7e34;
        }
    </style>
</head>
<body>
    <h1>Lista de Produtos Cadastrados</h1>

    <div th:if="${mensagem}" class="alert alert-success" role="alert">
        <strong th:text="${mensagem}"></strong>
    </div>

    <table>
        <thead>
            <tr>
                <th>Tombamento</th>
                <th>Descrição</th>
                <th>Modelo</th>
                <th>Colaborador</th>
                <th>Destino</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="produto : ${produtos}">
                <td th:text="${produto.tombamento != null ? produto.tombamento : '-'}"></td>
                <td th:text="${produto.descricao}"></td>
                <td th:text="${produto.modelo != null ? produto.modelo : '-'}"></td>
                <td th:text="${produto.colaborador != null ? produto.colaborador.lDap : '-'}"></td>
                <td th:text="${produto.destino != null ? produto.destino.agencia.descricao : '-'}"></td>
                <td>
                    <a th:href="@{/cadastrarProduto/editar/{tombamento}(tombamento=${produto.tombamento})}">Editar</a>
                    <span style="margin: 0 5px;">|</span>
                    <a th:href="@{/cadastrarProduto/excluir/{tombamento}(tombamento=${produto.tombamento})}"
                       onclick="return confirm('Tem certeza que deseja excluir este produto?')">Excluir</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(produtos)}">
                <td colspan="6">Nenhum produto cadastrado ainda.</td>
            </tr>
        </tbody>
    </table>

    <br>
    <a href="/cadastrarProduto" class="button">Cadastrar Novo Produto</a>
</body>
</html>
